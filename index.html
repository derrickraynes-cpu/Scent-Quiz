<section id="oligie-scent-quiz" style="--ink:#1c1d1d;--paper:#ffffff;--line:#e7e2da;--btn:#111111;">
<style>
  #oligie-scent-quiz {
    font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    max-width: 900px;
    margin: 0 auto;
    padding: 64px 20px 96px;
    box-sizing: border-box;
  }
  #oligie-scent-quiz *, #oligie-scent-quiz *:before, #oligie-scent-quiz *:after { box-sizing: border-box; }
  #oligie-scent-quiz h1, #oligie-scent-quiz h2, #oligie-scent-quiz h3 {
    font-family: "Chivo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-weight: 700;
    margin: 0;
  }
  #oligie-scent-quiz .osq-eyebrow {
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    opacity: 0.55;
    margin-bottom: 10px;
  }
  #oligie-scent-quiz .osq-step {
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.38;
    margin-bottom: 18px;
  }
  #oligie-scent-quiz .osq-title {
    text-align: center;
    font-size: clamp(28px, 4.2vw, 44px);
    line-height: 1.08;
    margin-bottom: 12px;
  }
  #oligie-scent-quiz .osq-sub {
    text-align: center;
    font-size: 16px;
    line-height: 1.5;
    max-width: 480px;
    margin: 0 auto 48px;
    opacity: 0.75;
  }
  #oligie-scent-quiz .osq-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  #oligie-scent-quiz .osq-card {
    border: 1px solid rgba(255,255,255,0.28);
    background: transparent;
    padding: 28px 16px 22px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #oligie-scent-quiz .osq-card:hover {
    border-color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255,255,255,0.10);
  }
  #oligie-scent-quiz .osq-card:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }
  #oligie-scent-quiz .osq-icon {
    width: 30px;
    height: 30px;
    color: #fff;
    opacity: 0.7;
    transition: opacity .2s ease;
  }
  #oligie-scent-quiz .osq-icon svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  #oligie-scent-quiz .osq-card:hover .osq-icon {
    opacity: 1;
  }
  #oligie-scent-quiz .osq-card-label {
    font-family: "Chivo", sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  #oligie-scent-quiz .osq-card-sub {
    font-size: 12.5px;
    opacity: 0.6;
    line-height: 1.4;
  }
  #oligie-scent-quiz .osq-back {
    display: none;
    margin: 32px auto 0;
    background: none;
    border: none;
    font-family: "Instrument Sans", sans-serif;
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 3px;
    color: #fff;
    opacity: 0.5;
    cursor: pointer;
    padding: 4px;
  }
  #oligie-scent-quiz .osq-back:hover { opacity: 0.9; }

  #oligie-scent-quiz .osq-result {
    display: none;
    max-width: 620px;
    margin: 0 auto;
  }
  #oligie-scent-quiz .osq-result.osq-active { display: block; }
  #oligie-scent-quiz .osq-quiz.osq-hidden { display: none; }
  #oligie-scent-quiz .osq-quiz {
    background: #000;
    color: #fff;
    padding: 56px 28px 60px;
  }

  #oligie-scent-quiz .osq-result-eyebrow {
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 12px;
    font-weight: 700;
    opacity: 0.55;
    margin-bottom: 16px;
  }
  #oligie-scent-quiz .osq-result-img {
    display: block;
    width: 220px;
    height: auto;
    margin: 0 auto 28px;
  }
  #oligie-scent-quiz .osq-result-title {
    text-align: center;
    font-size: clamp(26px, 4vw, 38px);
    margin-bottom: 10px;
  }
  #oligie-scent-quiz .osq-result-tagline {
    text-align: center;
    font-size: 15.5px;
    line-height: 1.6;
    max-width: 480px;
    margin: 0 auto 30px;
    opacity: 0.75;
  }
  #oligie-scent-quiz .osq-notes {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 22px 0;
    margin-bottom: 32px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    text-align: center;
  }
  #oligie-scent-quiz .osq-note-label {
    font-family: "Chivo", sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.5;
    margin-bottom: 6px;
  }
  #oligie-scent-quiz .osq-note-val {
    font-size: 13.5px;
    line-height: 1.45;
  }
  #oligie-scent-quiz .osq-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  #oligie-scent-quiz .osq-retake {
    background: none;
    border: none;
    font-family: "Instrument Sans", sans-serif;
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 3px;
    color: var(--ink);
    opacity: 0.6;
    cursor: pointer;
    padding: 4px;
  }
  #oligie-scent-quiz .osq-retake:hover { opacity: 1; }
</style>

<div class="osq-quiz" id="osq-quiz">
  <div class="osq-eyebrow">Find Your Scent</div>
  <div class="osq-step" id="osq-step">Question 1 of 3</div>
  <h1 class="osq-title" id="osq-q-title">What's your vibe?</h1>
  <p class="osq-sub" id="osq-q-sub">No fragrance jargon required. Pick the feeling you're chasing right now.</p>
  <div class="osq-grid" id="osq-grid" role="list"></div>
  <button class="osq-back" id="osq-back">&larr; Back</button>
</div>

<div class="osq-result" id="osq-result">
  <div class="osq-result-eyebrow" id="osq-result-eyebrow">You're a match with</div>
  <img class="osq-result-img" id="osq-result-img" src="" alt="">
  <h2 class="osq-result-title" id="osq-result-title"></h2>
  <p class="osq-result-tagline" id="osq-result-tagline"></p>
  <div class="osq-notes">
    <div><div class="osq-note-label">Top</div><div class="osq-note-val" id="osq-note-top"></div></div>
    <div><div class="osq-note-label">Mid</div><div class="osq-note-val" id="osq-note-mid"></div></div>
    <div><div class="osq-note-label">Base</div><div class="osq-note-val" id="osq-note-base"></div></div>
  </div>
  <div class="osq-actions">
    <button class="osq-retake" id="osq-retake">&larr; Retake the quiz</button>
  </div>
</div>
</section>

<script>
(function () {
  var ICONS = {
    cabo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 1.5v3M12 19.5v3M22.5 12h-3M4.5 12h-3M19.4 4.6l-2.1 2.1M6.7 17.3l-2.1 2.1M19.4 19.4l-2.1-2.1M6.7 6.7l-2.1-2.1"/></svg>',
    faroe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 9.5c1.8-2 3.6-2 5.4 0s3.6 2 5.4 0 3.6-2 5.4 0 3.6 2 5.4 0"/><path d="M1.5 15.5c1.8-2 3.6-2 5.4 0s3.6 2 5.4 0 3.6-2 5.4 0 3.6 2 5.4 0"/></svg>',
    mallorca: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 19.5C5 11 10 5 19.5 4.2c.9 9-4.6 14.5-14 15.3z"/><path d="M6 19C10 14.5 13 10.5 18 6"/></svg>',
    giverny: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><ellipse cx="12" cy="6.6" rx="2.3" ry="3.4"/><ellipse cx="17" cy="10.1" rx="2.3" ry="3.4" transform="rotate(72 17 10.1)"/><ellipse cx="15.2" cy="16.3" rx="2.3" ry="3.4" transform="rotate(144 15.2 16.3)"/><ellipse cx="8.8" cy="16.3" rx="2.3" ry="3.4" transform="rotate(216 8.8 16.3)"/><ellipse cx="7" cy="10.1" rx="2.3" ry="3.4" transform="rotate(288 7 10.1)"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>',
    tribeca: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 119.8 3.5a7 7 0 0010.7 10.7z"/></svg>',
    oia: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2c.7 4.4 2.1 6.9 6 8-3.9 1.1-5.3 3.6-6 8-.7-4.4-2.1-6.9-6-8 3.9-1.1 5.3-3.6 6-8z"/></svg>'
  };

  var DEST_ICONS = {
    cabo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V10"/><path d="M12 10c-2.5-3-6-3.5-9-1.5 2.5 2.5 6 2.8 9 1.5z"/><path d="M12 10c2.5-3 6-3.5 9-1.5-2.5 2.5-6 2.8-9 1.5z"/><path d="M12 10c-1-3-4-4.5-6.5-3.5 1.8 2.3 4 3.2 6.5 3.5z"/><path d="M12 10c1-3 4-4.5 6.5-3.5-1.8 2.3-4 3.2-6.5 3.5z"/></svg>',
    faroe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 15l5-9 4 6 3-4 8 7"/><path d="M2 19c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0"/></svg>',
    mallorca: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M12 5l6 8-6-1.5z"/><path d="M12 7l-5 6 5-1z"/><path d="M4 19c2.5-1.6 5-1.6 8 0s5.5 1.6 8 0"/></svg>',
    giverny: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="M12 14c-3-.5-5-3-4.5-6C10.5 8.5 12 11 12 14z"/><path d="M12 12c3-.5 5-3 4.5-6C13.5 6.5 12 9 12 12z"/></svg>',
    tribeca: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l4-3 4 3v12"/><path d="M11 21V5l4-2.5L19 5v16"/><path d="M3 21h18"/></svg>',
    oia: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="3"/><path d="M2 21c2.5-4 5-6 10-6s7.5 2 10 6"/><path d="M8 21c0-2.5 1.8-4.5 4-4.5s4 2 4 4.5"/></svg>'
  };

  var PRODUCTS = {
    cabo: {
      product: "Cabo",
      handle: "cabo-parfume",
      image: "https://cdn.shopify.com/s/files/1/0642/2580/4426/files/cabo_with_badge.png?v=1786683452",
      tagline: "Breathtaking beaches and thrilling nightlife — a playful, bohemian blend that celebrates love and life.",
      notes: { top: "Lychee, Pear, Blackcurrant", mid: "Passionfruit, Cardamom, Peony", base: "Sandalwood, Musk" }
    },
    faroe: {
      product: "Faroe",
      handle: "faroe-parfum-oil",
      image: "https://cdn.shopify.com/s/files/1/0642/2580/4426/files/cef17e367a533b11adf21ccf828568ab9e905c1d870854f9ddbf2f3f67d00185.jpg?v=1710469352",
      tagline: "Dramatic volcanic cliffs meet a refreshing ocean breeze — the essence of optimism and adventure.",
      notes: { top: "Lemon, Orange, Mandarin", mid: "Lily of the Valley, Green Apple", base: "Cedarwood, Amber, Musk" }
    },
    mallorca: {
      product: "Mallorca",
      handle: "mallorca-parfume",
      image: "https://cdn.shopify.com/s/files/1/0642/2580/4426/files/747002efb55f39e938f97e49247fb4be4a657b0d2a3b73dfcc69c786aef5e478.jpg?v=1710467383",
      tagline: "Gold beaches melt into the aqua sea — an elegant, fruity, sensual scent that dares you to be free and live in the moment.",
      notes: { top: "Blackberry, Bergamot, Pear", mid: "Iris, Orange Blossom, Jasmine", base: "Benzoin, Patchouli, Tonka Bean" }
    },
    giverny: {
      product: "Giverny",
      handle: "giverny-parfum-oil",
      image: "https://cdn.shopify.com/s/files/1/0642/2580/4426/files/4df0d86ecda117be2c09fef6a6ce6b8ecf66e7fa96837db76789ed559e08e7de.jpg?v=1710469212",
      tagline: "Lush, extravagant flora that has inspired artists and lovers for centuries — persuasive, elegant, alive.",
      notes: { top: "Dewy Greens, Mandarin, Bergamot", mid: "Mimosa, Ylang Ylang, Rose", base: "Vetiver, Patchouli, Tonka Bean" }
    },
    tribeca: {
      product: "Tribeca",
      handle: "tribeca-parfum",
      image: "https://cdn.shopify.com/s/files/1/0642/2580/4426/files/326f316469d421a7f2aeaac98d1274aff2f7911dc8f186a49f2f762ac9a7864c.jpg?v=1710467823",
      tagline: "One of New York's most eclectic neighborhoods — strong and sophisticated, this seductive fragrance owns every room.",
      notes: { top: "Bergamot, Pink Peppercorn, Galbanum", mid: "Amber, Sheer Jasmine, Benzoin", base: "Oak Moss, Patchouli, Cedarwood" }
    },
    oia: {
      product: "Oia",
      handle: "oia-parfum-oil",
      image: "https://cdn.shopify.com/s/files/1/0642/2580/4426/files/4e81b1ecde26175a65c46669a36cc83cc760398d4c386937e3884b11cc5e962f.jpg?v=1710469477",
      tagline: "The charming Santorini village romances her guests with iconic architecture and ethereal sunsets — divinely elegant, enduring.",
      notes: { top: "Bergamot, Mandarin, Peach", mid: "Rose Absolute, Ylang Ylang, Jasmine", base: "Sandalwood, Musk, Violet Wood" }
    }
  };

  var QUESTIONS = [
    {
      title: "What's your vibe?",
      sub: "No fragrance jargon required. Pick the feeling you're chasing right now.",
      weight: 2,
      options: [
        { key: "cabo", icon: ICONS.cabo, label: "Sun-Drenched", sub: "Warm, sensual, effortless" },
        { key: "faroe", icon: ICONS.faroe, label: "Fresh & Clean", sub: "Airy, bright, effortless" },
        { key: "mallorca", icon: ICONS.mallorca, label: "Green & Earthy", sub: "Natural, sophisticated, grounded" },
        { key: "giverny", icon: ICONS.giverny, label: "Romantic", sub: "Floral, feminine, timeless" },
        { key: "tribeca", icon: ICONS.tribeca, label: "City Nights", sub: "Magnetic, sophisticated, seductive" },
        { key: "oia", icon: ICONS.oia, label: "Elevated", sub: "Luxurious, polished, unforgettable" }
      ]
    },
    {
      title: "Where do you dream of escaping to?",
      sub: "Every Oligie scent is inspired by a real place. Pick the one calling you.",
      weight: 1,
      options: [
        { key: "cabo", icon: DEST_ICONS.cabo, label: "Tropical Beach", sub: "Sun, sand & nightlife" },
        { key: "faroe", icon: DEST_ICONS.faroe, label: "Wild Coastal Cliffs", sub: "Nordic islands & ocean air" },
        { key: "mallorca", icon: DEST_ICONS.mallorca, label: "Mediterranean Island", sub: "Gold beaches, aqua sea" },
        { key: "giverny", icon: DEST_ICONS.giverny, label: "Garden Countryside", sub: "Lush French gardens" },
        { key: "tribeca", icon: DEST_ICONS.tribeca, label: "Iconic City", sub: "The energy of New York" },
        { key: "oia", icon: DEST_ICONS.oia, label: "Cliffside Sunset Village", sub: "Santorini at golden hour" }
      ]
    },
    {
      title: "How do you want to feel wearing it?",
      sub: "Choose the mood you want to carry with you.",
      weight: 1,
      options: [
        { key: "cabo", icon: ICONS.cabo, label: "Tropical & Playful", sub: "Radiant, effortless, alive" },
        { key: "faroe", icon: ICONS.faroe, label: "Fresh & Serene", sub: "Bright, elevated, calm" },
        { key: "mallorca", icon: ICONS.mallorca, label: "Elegant & Sensual", sub: "Fruity, refined, free" },
        { key: "giverny", icon: ICONS.giverny, label: "Romantic & Timeless", sub: "Lush, persuasive, alive" },
        { key: "tribeca", icon: ICONS.tribeca, label: "Magnetic & Sophisticated", sub: "Urban, bold, seductive" },
        { key: "oia", icon: ICONS.oia, label: "Luxurious & Enchanting", sub: "Ethereal, polished, rare" }
      ]
    }
  ];

  var root = document.getElementById("oligie-scent-quiz");
  var grid = root.querySelector("#osq-grid");
  var quizEl = root.querySelector("#osq-quiz");
  var resultEl = root.querySelector("#osq-result");
  var stepEl = root.querySelector("#osq-step");
  var qTitleEl = root.querySelector("#osq-q-title");
  var qSubEl = root.querySelector("#osq-q-sub");
  var backBtn = root.querySelector("#osq-back");

  var answers = [];
  var current = 0;

  function scrollUp() {
    quizEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function renderQuestion() {
    var q = QUESTIONS[current];
    stepEl.textContent = "Question " + (current + 1) + " of " + QUESTIONS.length;
    qTitleEl.textContent = q.title;
    qSubEl.textContent = q.sub;
    backBtn.style.display = current > 0 ? "inline-block" : "none";
    grid.innerHTML = "";
    q.options.forEach(function (opt) {
      var card = document.createElement("div");
      card.className = "osq-card";
      card.setAttribute("role", "listitem");
      card.setAttribute("tabindex", "0");
      card.innerHTML =
        '<div class="osq-icon">' + opt.icon + "</div>" +
        '<div class="osq-card-label">' + opt.label + "</div>" +
        '<div class="osq-card-sub">' + opt.sub + "</div>";
      function choose() { selectOption(opt.key); }
      card.addEventListener("click", choose);
      card.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(); }
      });
      grid.appendChild(card);
    });
  }

  function selectOption(key) {
    answers[current] = key;
    current++;
    if (current < QUESTIONS.length) {
      renderQuestion();
      scrollUp();
    } else {
      showResult();
    }
  }

  backBtn.addEventListener("click", function () {
    if (current > 0) {
      current--;
      renderQuestion();
      scrollUp();
    }
  });

  function computeScores() {
    var scores = {};
    answers.forEach(function (key, i) {
      if (!key) return;
      scores[key] = (scores[key] || 0) + QUESTIONS[i].weight;
    });
    return scores;
  }

  function showResult() {
    var scores = computeScores();
    var keys = Object.keys(PRODUCTS);
    var bestKey = keys[0], bestScore = -1;
    keys.forEach(function (key) {
      var s = scores[key] || 0;
      if (s > bestScore) { bestScore = s; bestKey = key; }
    });
    var firstKey = answers[0];
    if ((scores[firstKey] || 0) === bestScore) { bestKey = firstKey; }

    var a = PRODUCTS[bestKey];
    root.querySelector("#osq-result-img").src = a.image;
    root.querySelector("#osq-result-img").alt = a.product + " Parfum Oil";
    root.querySelector("#osq-result-title").textContent = a.product === "Tribeca" ? "Tribeca is your Scent" : "You're a " + a.product + " girl.";
    root.querySelector("#osq-result-tagline").textContent = a.tagline;
    root.querySelector("#osq-note-top").textContent = a.notes.top;
    root.querySelector("#osq-note-mid").textContent = a.notes.mid;
    root.querySelector("#osq-note-base").textContent = a.notes.base;
    quizEl.classList.add("osq-hidden");
    resultEl.classList.add("osq-active");
    resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  root.querySelector("#osq-retake").addEventListener("click", function () {
    answers = [];
    current = 0;
    resultEl.classList.remove("osq-active");
    quizEl.classList.remove("osq-hidden");
    renderQuestion();
    scrollUp();
  });

  renderQuestion();
})();
</script>
